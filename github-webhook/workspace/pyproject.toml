[project]
name = "pi-scraper-service"
version = "0.1.0"
description = "Pi-based captcha solving engine scaffold"
requires-python = ">=3.10,<3.14"
dependencies = [
  "pydantic>=2.11",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
  "playwright>=1.40",
  "loguru>=0.7.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=1.0",
  "ruff>=0.12",
  "mypy>=1.17",
  "vulture>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pi_scraper_service"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
